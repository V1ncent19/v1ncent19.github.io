<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- antenna -->
  <line x1="50" y1="19" x2="50" y2="29"/>
  <line x1="47" y1="29" x2="53" y2="29"/>

  <!-- upper tower -->
  <path d="M47 29 L44 39"/>
  <path d="M53 29 L56 39"/>

  <!-- upper observation deck -->
  <line x1="42" y1="39" x2="58" y2="39"/>
  <line x1="43" y1="43" x2="57" y2="43"/>

  <!-- middle tower -->
  <path d="M44 43 L40 53"/>
  <path d="M56 43 L60 53"/>

  <!-- main observation deck -->
  <path d="M37 53 H63"/>
  <path d="M39 58 H61"/>
  <line x1="39" y1="53" x2="39" y2="58"/>
  <line x1="61" y1="53" x2="61" y2="58"/>

  <!-- lower tower legs -->
  <path d="M40 58 L29 74"/>
  <path d="M60 58 L71 74"/>

  <!-- central lattice -->
  <line x1="40" y1="58" x2="60" y2="72"/>
  <line x1="60" y1="58" x2="40" y2="72"/>

  <!-- lower cross braces -->
  <line x1="35" y1="66" x2="65" y2="66"/>

  <!-- feet -->
  <line x1="26" y1="74" x2="38" y2="74"/>
  <line x1="62" y1="74" x2="74" y2="74"/>

  <!-- base -->
  <line x1="31" y1="78" x2="69" y2="78"/>
</svg>
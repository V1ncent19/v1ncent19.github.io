<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- spire -->
  <path d="M42 31 L50 20 L58 31"/>

  <!-- roof -->
  <line x1="40" y1="32" x2="60" y2="32"/>

  <!-- upper tower -->
  <path d="M43 32 V43"/>
  <path d="M57 32 V43"/>

  <!-- clock housing -->
  <path d="M40 43 H60 V58 H40 Z"/>

  <!-- clock face -->
  <circle cx="50" cy="50" r="5"/>

  <!-- clock hands -->
  <line x1="50" y1="50" x2="50" y2="46"/>
  <line x1="50" y1="50" x2="54" y2="52"/>

  <!-- lower tower -->
  <path d="M43 58 V71"/>
  <path d="M57 58 V71"/>

  <!-- arched entrance -->
  <path d="M46 71 V66 Q50 61 54 66 V71"/>

  <!-- base -->
  <line x1="38" y1="71" x2="62" y2="71"/>
  <line x1="41" y1="76" x2="59" y2="76"/>
</svg>
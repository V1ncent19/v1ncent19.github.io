  <path d="M31 68 Q50 48 69 68"/>

  <!-- vertical supports -->
  <line x1="32" y1="43" x2="32" y2="62"/>
  <line x1="39" y1="43" x2="39" y2="52"/>
  <line x1="46" y1="43" x2="46" y2="47"/>

  <line x1="54" y1="43" x2="54" y2="47"/>
  <line x1="61" y1="43" x2="61" y2="52"/>
  <line x1="68" y1="43" x2="68" y2="62"/>

  <!-- arch lattice -->
  <path d="M29 65 L35 57 L39 61 L44 51 L48 55"/>
  <path d="M71 65 L65 57 L61 61 L56 51 L52 55"/>

  <!-- bridge feet -->
  <line x1="24" y1="68" x2="34" y2="68"/>
  <line x1="66" y1="68" x2="76" y2="68"/>

  <!-- river -->
  <line x1="28" y1="74" x2="43" y2="74"/>
  <line x1="57" y1="74" x2="72" y2="74"/>

  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- railway deck -->
  <line x1="23" y1="38" x2="77" y2="38"/>
  <line x1="25" y1="43" x2="75" y2="43"/>

  <!-- deck lattice -->
  <path d="
    M27 38 L33 43
    L39 38 L45 43
    L50 38 L55 43
    L61 38 L67 43
    L73 38
  "/>

  <!-- main steel arch -->

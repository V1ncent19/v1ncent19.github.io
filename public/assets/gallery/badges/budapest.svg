<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer travel badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- Budapest Parliament: central dome -->
  <path d="M43 43 Q50 32 57 43"/>
  <path d="M46 39 Q50 34 54 39"/>
  <line x1="50" y1="31" x2="50" y2="35"/>
  <path d="M48 31 L50 28 L52 31"/>

  <!-- dome base -->
  <line x1="41" y1="44" x2="59" y2="44"/>
  <line x1="43" y1="48" x2="57" y2="48"/>

  <!-- central tower -->
  <line x1="44" y1="48" x2="43" y2="65"/>
  <line x1="56" y1="48" x2="57" y2="65"/>

  <!-- left wing -->
  <path d="M43 51 L36 47 L29 51"/>
  <line x1="29" y1="51" x2="29" y2="66"/>
  <line x1="43" y1="51" x2="43" y2="66"/>

  <!-- right wing -->
  <path d="M57 51 L64 47 L71 51"/>
  <line x1="57" y1="51" x2="57" y2="66"/>
  <line x1="71" y1="51" x2="71" y2="66"/>

  <!-- side towers -->
  <path d="M27 51 L29 46 L31 51"/>
  <line x1="29" y1="46" x2="29" y2="42"/>

  <path d="M69 51 L71 46 L73 51"/>
  <line x1="71" y1="46" x2="71" y2="42"/>

  <!-- façade details -->
  <line x1="33" y1="56" x2="39" y2="56"/>
  <line x1="61" y1="56" x2="67" y2="56"/>

  <line x1="35" y1="56" x2="35" y2="63"/>
  <line x1="39" y1="56" x2="39" y2="63"/>

  <line x1="61" y1="56" x2="61" y2="63"/>
  <line x1="65" y1="56" x2="65" y2="63"/>

  <!-- central entrance -->
  <path d="M47 65 V57 Q50 53 53 57 V65"/>

  <!-- building base -->
  <line x1="26" y1="66" x2="74" y2="66"/>
  <line x1="30" y1="70" x2="70" y2="70"/>
</svg>
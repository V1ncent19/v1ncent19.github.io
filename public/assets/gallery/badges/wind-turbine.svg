<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer travel badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- three rotor blades -->
  <line x1="50" y1="39" x2="50" y2="23"/>
  <line x1="50" y1="39" x2="63.9" y2="47"/>
  <line x1="50" y1="39" x2="36.1" y2="47"/>

  <!-- hub -->
  <circle cx="50" cy="39" r="3"/>

  <!-- tapered tower -->
  <line x1="47" y1="66" x2="49" y2="42"/>
  <line x1="53" y1="66" x2="51" y2="42"/>

  <!-- ground -->
  <line x1="26" y1="66" x2="74" y2="66"/>

  <!-- wind streaks -->
  <path d="M28 47 q2.5 -5 8 -2"/>
  <path d="M26 58 q3 -5 8 -1"/>
</svg>

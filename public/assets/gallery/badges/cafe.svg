<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- café roof -->
  <line x1="31" y1="34" x2="69" y2="34"/>

  <!-- awning -->
  <path d="M30 42 L34 34 H66 L70 42"/>
  <path d="
    M30 42
    Q34 47 38 42
    Q42 47 46 42
    Q50 47 54 42
    Q58 47 62 42
    Q66 47 70 42
  "/>

  <!-- storefront -->
  <line x1="33" y1="46" x2="33" y2="69"/>
  <line x1="67" y1="46" x2="67" y2="69"/>

  <!-- left window -->
  <rect x="37" y="50" width="9" height="12"/>
  <line x1="37" y1="56" x2="46" y2="56"/>

  <!-- right window -->
  <rect x="54" y="50" width="9" height="12"/>
  <line x1="54" y1="56" x2="63" y2="56"/>

  <!-- central door -->
  <path d="M47 69 V52 H53 V69"/>
  <circle cx="51" cy="61" r="1"/>

  <!-- small café cup -->
  <path d="M45 29 H53 V32 H45 Z"/>
  <path d="M53 30 Q57 30 56 32 Q55 34 53 33"/>

  <!-- base -->
  <line x1="29" y1="69" x2="71" y2="69"/>
  <line x1="35" y1="74" x2="65" y2="74"/>
</svg>
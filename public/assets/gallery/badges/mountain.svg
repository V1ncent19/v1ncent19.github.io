<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="2.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- outer badge rings -->
  <circle cx="50" cy="50" r="41" stroke-dasharray="1.4 4.2"/>
  <circle cx="50" cy="50" r="35"/>

  <!-- main mountain -->
  <path d="M24 70 L50 28 L76 70"/>

  <!-- symmetric snow cap -->
  <path d="M40 44 L50 28 L60 44"/>
  <path d="M40 44 L45 41 L50 46 L55 41 L60 44"/>

  <!-- symmetric secondary peaks -->
  <path d="M24 70 L35 52 L43 65"/>
  <path d="M57 65 L65 52 L76 70"/>

  <!-- symmetric inner ridges -->
  <line x1="35" y1="70" x2="45" y2="54"/>
  <line x1="65" y1="70" x2="55" y2="54"/>

  <!-- symmetric lower contours -->
  <line x1="43" y1="65" x2="47" y2="70"/>
  <line x1="57" y1="65" x2="53" y2="70"/>

  <!-- base -->
  <line x1="24" y1="70" x2="76" y2="70"/>
</svg>